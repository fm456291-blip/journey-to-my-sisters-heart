<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/style.css">

<body>

<div id="stars"></div>

<audio id="bgMusic" autoplay loop>

</audio>

<section class="hero">

    <h3>CHAPTER FOUR</h3>

    <h1>Can You Complete Our Memory? 🧩</h1>

    <p>
        Every beautiful memory is made of little moments.<br>
        Put them together ❤️
    </p>

</section>

<div class="game-container">

    <p>
        Every piece found its place...<br>
        Just like you found yours in my life ❤️
    </p>

    <div id="score"></div>

    <button id="continueBtn">
        Continue ❤️
    </button>

</div>

</div>

<section id="quizSection" class="hidden">

    <h2>How Well Do You Remember? ❤️</h2>

    <div id="questionBox"></div>

</section>
