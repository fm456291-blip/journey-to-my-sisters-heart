<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Journey To My Sister's Heart ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- Heartbeat -->
    <audio id="heartbeat" preload="auto">
        <source src="assets/music/heartbeat.mp3" type="audio/mpeg">
    </audio>

    <!-- Opening Screen -->
    <div id="opening-screen">

        <div class="opening-content">

            <h1 id="opening-title">
                A Journey To My Sister's Heart
            </h1>

            <p id="opening-subtitle">
                For Someone I Proudly Call My Sister ❤️
            </p>

        </div>

    </div>
    <!-- Headphone Message -->

<div id="headphone-screen">

    <div class="headphone-content">

        <div class="headphone-icon">
            🎧
        </div>

        <p class="headphone-label">
            BEFORE WE BEGIN
        </p>

        <h2>
            Put On Your Headphones
        </h2>

        <p>
            This little journey has sounds,<br>
            memories and a few surprises waiting for you... ❤️
        </p>

        <button id="headphoneBtn">
            🎧 I'm Ready — Start The Journey
        </button>

    </div>

</div>

    <!-- Main Intro -->

    <section id="intro">

        <div id="stars"></div>

        <div class="aurora"></div>

        <div class="intro-content">

            <p id="typewriter"></p>

            <button id="startBtn">
                ✨ Touch The Star
            </button>

        </div>

    </section>

    <!-- JS -->

    <script src="js/app.js"></script>
    <script src="js/animations.js"></script>

</body>

</html>
